server {
  listen 80;

  client_max_body_size 25m;

  location /api/v1/auth/ {
    proxy_pass http://auth-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/chat/ {
    proxy_pass http://auth-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/books/ {
    proxy_pass http://catalog-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/uploads/ {
    proxy_pass http://catalog-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/donations/ {
    proxy_pass http://catalog-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/orders/ {
    proxy_pass http://sales-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/wishlist/ {
    proxy_pass http://sales-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs/auth {
    proxy_pass http://auth-service:8000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /docs/catalog {
    proxy_pass http://catalog-service:8000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /docs/sales {
    proxy_pass http://sales-service:8000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /docs {
    return 302 /docs/auth;
  }

  location /static/ {
    proxy_pass http://catalog-service:8000/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
