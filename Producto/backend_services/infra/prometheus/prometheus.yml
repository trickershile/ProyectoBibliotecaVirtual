global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api_gateway
    static_configs:
      - targets: ["api_gateway:8080"]
    metrics_path: /metrics

  - job_name: auth_service
    static_configs:
      - targets: ["auth_service:8000"]
    metrics_path: /metrics

  - job_name: catalog_service
    static_configs:
      - targets: ["catalog_service:8001"]
    metrics_path: /metrics

  - job_name: ia_recommender
    static_configs:
      - targets: ["ia_recommender:8002"]
    metrics_path: /metrics

  - job_name: orders_service
    static_configs:
      - targets: ["orders_service:8003"]
    metrics_path: /metrics

  - job_name: shipping_service
    static_configs:
      - targets: ["shipping_service:8004"]
    metrics_path: /metrics

  - job_name: payment_service
    static_configs:
      - targets: ["payment_service:8005"]
    metrics_path: /metrics

  - job_name: cart_service
    static_configs:
      - targets: ["cart_service:8006"]
    metrics_path: /metrics

  - job_name: inventory_sync_service
    static_configs:
      - targets: ["inventory_sync_service:8009"]
    metrics_path: /metrics

  - job_name: notification_service
    static_configs:
      - targets: ["notification_service:8007"]
    metrics_path: /metrics

  - job_name: search_service
    static_configs:
      - targets: ["search_service:8008"]
    metrics_path: /metrics

  - job_name: digital_delivery_service
    static_configs:
      - targets: ["digital_delivery_service:8010"]
    metrics_path: /metrics

  - job_name: reviews_service
    static_configs:
      - targets: ["reviews_service:8012"]
    metrics_path: /metrics
